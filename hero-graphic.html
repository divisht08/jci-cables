<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCI Cables Hero Graphic</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f0f0f0;
        }
        canvas {
            display: block;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <canvas id="heroCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heroCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size (16:9 aspect ratio - good for websites)
        canvas.width = 1600;
        canvas.height = 900;

        // Colors from JCI design system
        const navy = '#0a1428';
        const navyLight = '#1e3a5f';
        const gold = '#e8920a';
        const goldLight = '#f5a623';
        const white = '#ffffff';

        // Background gradient
        const bgGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        bgGradient.addColorStop(0, navy);
        bgGradient.addColorStop(1, navyLight);
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Decorative glow (radial gradient)
        const glowGradient = ctx.createRadialGradient(canvas.width * 0.8, canvas.height * 0.2, 0, canvas.width * 0.8, canvas.height * 0.2, 600);
        glowGradient.addColorStop(0, 'rgba(232, 146, 10, 0.2)');
        glowGradient.addColorStop(1, 'rgba(232, 146, 10, 0)');
        ctx.fillStyle = glowGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw animated cable illustrations
        function drawCable(x, y, angle, length, thickness) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Outer jacket (dark)
            ctx.strokeStyle = '#2d3748';
            ctx.lineWidth = thickness;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(length, 0);
            ctx.stroke();

            // Braid pattern (gold)
            ctx.strokeStyle = goldLight;
            ctx.lineWidth = thickness * 0.3;
            for (let i = 0; i < length; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, -thickness/4);
                ctx.quadraticCurveTo(i + 20, thickness/4, i + 40, -thickness/4);
                ctx.stroke();
            }

            // Core (copper/gold)
            ctx.strokeStyle = gold;
            ctx.lineWidth = thickness * 0.15;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(length, 0);
            ctx.stroke();

            ctx.restore();
        }

        // Draw cables in dynamic arrangement
        drawCable(200, 200, Math.PI / 8, 400, 30);
        drawCable(300, 500, -Math.PI / 6, 450, 28);
        drawCable(900, 150, Math.PI / 12, 380, 26);
        drawCable(1000, 600, -Math.PI / 7, 420, 32);

        // Draw connector circles
        function drawConnector(x, y, size, type) {
            ctx.save();
            ctx.translate(x, y);

            // Outer ring
            ctx.strokeStyle = goldLight;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.stroke();

            // Inner circle
            ctx.fillStyle = gold;
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.6, 0, Math.PI * 2);
            ctx.fill();

            // Center detail
            ctx.fillStyle = navyLight;
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        drawConnector(150, 250, 40, 'rf');
        drawConnector(1350, 300, 45, 'coaxial');
        drawConnector(200, 750, 35, 'ethernet');
        drawConnector(1400, 700, 42, 'cctv');

        // Main text
        ctx.fillStyle = white;
        ctx.font = 'bold 80px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('Premium Cable', 100, 400);

        // Gradient text for key word
        const textGradient = ctx.createLinearGradient(100, 450, 700, 550);
        textGradient.addColorStop(0, gold);
        textGradient.addColorStop(1, goldLight);
        ctx.fillStyle = textGradient;
        ctx.font = 'bold 80px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillText('Solutions', 100, 530);

        // Tagline
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.font = '24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('Quality Connectivity for India', 100, 600);

        // Feature badges
        function drawBadge(x, y, text, icon) {
            ctx.fillStyle = 'rgba(232, 146, 10, 0.15)';
            ctx.strokeStyle = 'rgba(232, 146, 10, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(x, y, 280, 70, 15);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = goldLight;
            ctx.font = 'bold 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(icon + ' ' + text, x + 20, y + 50);
        }

        drawBadge(100, 700, 'ISO Certified', '✓');
        drawBadge(420, 700, 'Fast Delivery', '⚡');
        drawBadge(740, 700, 'Best Pricing', '💰');

        // Watermark
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.font = '18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('JCI Cables | New Delhi', canvas.width - 30, canvas.height - 30);
    </script>
</body>
</html>
